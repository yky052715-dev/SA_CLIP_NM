[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-clip-nm"
version = "0.1.0"
description = "Spatially adaptive CLIP normal memory for industrial anomaly detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.0",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1,<2.2",
  "transformers>=4.41,<4.47",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
visualization = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

